<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <script type="module" src="js/main.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Changa+One:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>
  <div id="svg-container"></div>

  <div class="drawer-content">
    <div class="selector-container" id="menu">
      <div class="header-container">
        <header>
          <a href="https://scc.losrios.edu/">
            <img class="scc-logo" src="scc-logo-final.png">
          </a>
          <div class="header-text">
            <h1 class="pantherpathways-title"><a href="https://scc.losrios.edu/">PantherPathways</a></h1>
            <h3 class="address-text">3835 Freeport Blvd. | Sacramento, CA 95822</h3>
          </div>
        </header>
        <input type="text" placeholder="Select Start Location" id="startLocator" autocomplete="off"/>
        <ul id="startSuggestions"></ul>
        <input type="text" placeholder="Select End Location" id="endLocator" autocomplete="off"/>
        <ul id="endSuggestions"></ul>
      </div>
    </div>

    <script type="module">
      import { PathfindingAPI } from "./js/main.js"

      const startLocations = ["PAS (Parking Structure)", "MAK (Makerspace)", "LUC (Lusk Center)", "CST (College Store)", "HSP (Hoos Swimming Pool)", "CDC (Child Development Center)", "PAN (Panther Cares)", "UNS (Union Stadium)", "NOG (North Gymnasium)", "STC (Student Center)", "SOG (South Gymnasium)", "BUS (Business Building)", "LRC (Learning Resource Center)", "NAS (Natural Sciences Building)", "MOH (Mohr Hall)", "RHS (Rodda Hall South)", "RHN (Rodda Hall North)", "CIC (City Cafe)", "FFA (Fischbacher Fine Arts Building)", "PAC (Performing Arts Center)", "STS (Student Services)", "SHW (Student Health & Wellness Center)", "COS (Cosmetology Building)", "TEC (Technology)", "ACT (Art Court Theatre)"];
      const endLocations = ["PAS (Parking Structure)", "MAK (Makerspace)", "LUC (Lusk Center)", "CST (College Store)", "HSP (Hoos Swimming Pool)", "CDC (Child Development Center)", "PAN (Panther Cares)", "UNS (Union Stadium)", "NOG (North Gymnasium)", "STC (Student Center)", "SOG (South Gymnasium)", "BUS (Business Building)", "LRC (Learning Resource Center)", "NAS (Natural Sciences Building)", "MOH (Mohr Hall)", "RHS (Rodda Hall South)", "RHN (Rodda Hall North)", "CIC (City Cafe)", "FFA (Fischbacher Fine Arts Building)", "PAC (Performing Arts Center)", "STS (Student Services)", "SHW (Student Health & Wellness Center)", "COS (Cosmetology Building)", "TEC (Technology)", "ACT (Art Court Theatre)"];

      startLocations.sort();
      endLocations.sort();

      const startLocationSelector = document.getElementById("startLocator");
      const endLocationSelector = document.getElementById("endLocator");
      const startList = document.getElementById("startSuggestions");
      const endList = document.getElementById("endSuggestions");

      let finalStartLocation = null;
      let finalEndLocation = null;

      // Filter suggestions as the user types.
      startLocationSelector.addEventListener("keyup", (event) => {
        const qry = startLocationSelector.value.toLowerCase();
        startList.innerHTML = "";
        if (!qry.length) return;
        startLocations
          .filter((item) => item.toLowerCase().includes(qry))
          .forEach((location) => {
            const li = document.createElement("li");
            li.textContent = location;
            startList.appendChild(li);
          });
      });

      endLocationSelector.addEventListener("keyup", (event) => {
        const qry = endLocationSelector.value.toLowerCase();
        endList.innerHTML = "";
        if (!qry.length) return;
        endLocations
          .filter((item) => item.toLowerCase().includes(qry))
          .forEach((location) => {
            const li = document.createElement("li");
            li.textContent = location;
            endList.appendChild(li);
          });
      });

      // Show the full list when the input is clicked.
      startLocator.addEventListener("click", (event) => {
        startList.innerHTML = "";
        startLocations.forEach((location) => {
          const li = document.createElement("li");
          li.textContent = location;
          startList.appendChild(li);
        });
      });

      endLocationSelector.addEventListener("click", (event) => {
        endList.innerHTML = "";
        endLocations.forEach((location) => {
          const li = document.createElement("li");
          li.textContent = location;
          endList.appendChild(li);
        });
      });

      // Selecting a suggestion fills the input; once both endpoints are set, run pathfinding.
      startList.addEventListener("click", (event) => {
        if (event.target.tagName === "LI") {
          startLocationSelector.value = event.target.textContent;
          startList.innerHTML = "";
        }
        finalStartLocation = "vnode-" + startLocationSelector.value.slice(0, 3);
        if (finalStartLocation && finalEndLocation) {
          connectCircles(PathfindingAPI.findPath(finalStartLocation, finalEndLocation));
        }
      });

      endList.addEventListener("click", (event) => {
        if (event.target.tagName === "LI") {
          endLocationSelector.value = event.target.textContent;
          endList.innerHTML = "";
        }
        finalEndLocation = "vnode-" + endLocationSelector.value.slice(0, 3);
        if (finalStartLocation && finalEndLocation) {
          connectCircles(PathfindingAPI.findPath(finalStartLocation, finalEndLocation));
        }
      });

      // Dismiss suggestion lists when clicking outside either input.
      document.addEventListener("click", (event) => {
        const clickedInsideStart =
          startLocationSelector.contains(event.target) || startList.contains(event.target);
        const clickedInsideEnd =
          endLocationSelector.contains(event.target) || endList.contains(event.target);

        if (!clickedInsideStart) startList.innerHTML = "";
        if (!clickedInsideEnd) endList.innerHTML = "";
      });

      startLocationSelector.addEventListener("focus", () => { menu.style.display = "block"; });
      endLocationSelector.addEventListener("focus", () => { menu.style.display = "block"; });

      // Draws SVG lines connecting the ordered list of node IDs returned by the pathfinder.
      function connectCircles(ids) {
        const linesGroup = document.getElementById("lines");
        linesGroup.innerHTML = "";

        for (let i = 0; i < ids.length - 1; i++) {
          const circle1 = document.getElementById(ids[i]);
          const circle2 = document.getElementById(ids[i + 1]);

          if (circle1 && circle2) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", circle1.getAttribute("cx"));
            line.setAttribute("y1", circle1.getAttribute("cy"));
            line.setAttribute("x2", circle2.getAttribute("cx"));
            line.setAttribute("y2", circle2.getAttribute("cy"));
            line.setAttribute("stroke", "#DCAA00");
            line.setAttribute("stroke-width", "2");
            line.setAttribute("stroke-linecap", "round");
            linesGroup.appendChild(line);
          }
        }
      }
    </script>
  </div>

  <!-- Slide-up Info Drawer -->
  <div class="info-drawer" id="infoDrawer">
    <div class="info-drawer-handle" id="infoDrawerHandle">
      <span class="info-drawer-label">
        <span class="info-icon">ℹ</span>
        <span>More Info</span>
        <span class="drawer-arrow" id="drawerArrow">∧</span>
      </span>
    </div>
    <div class="info-drawer-divider"></div>
    <div class="info-drawer-body">
      <!-- Content to be implemented -->
    </div>
  </div>

  <script>
    const infoDrawer = document.getElementById('infoDrawer');
    const infoDrawerHandle = document.getElementById('infoDrawerHandle');
    const drawerArrow = document.getElementById('drawerArrow');

    infoDrawerHandle.addEventListener('click', () => {
      const isOpen = infoDrawer.classList.toggle('open');
      drawerArrow.textContent = isOpen ? '∨' : '∧';
    });
  </script>
</body>

</html>
